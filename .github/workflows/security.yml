name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"     # weekly: new advisories appear without code changes

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # scan history, not only the tip
      - name: gitleaks (secret scanning)
        run: |
          set -euo pipefail
          VER=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o gl.tgz
          tar -xzf gl.tgz gitleaks
          ./gitleaks detect --source . --redact --verbose --exit-code 1

  python-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (engine + backend, resolved dependency set)
        run: |
          pip install pip-audit
          pip install -e ".[llm]"
          [ -f backend/pyproject.toml ] && pip install -e backend
          pip-audit --strict --desc

  node-deps:
    runs-on: ubuntu-latest
    if: hashFiles('web/package-lock.json') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web

  trivy-fs:
    # Vulnerabilities in lockfiles, misconfiguration in Dockerfiles/compose, and secrets in the tree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  trivy-images:
    # Build the platform images and scan them. Skipped until backend/ and web/ exist in the tree.
    runs-on: ubuntu-latest
    if: hashFiles('backend/pyproject.toml') != '' && hashFiles('web/package-lock.json') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: |
          docker build -f deploy/Dockerfile.backend -t ma-backend:ci .
          docker build -f deploy/Dockerfile.web -t ma-web:ci .
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ma-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ma-web:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config (static validation with placeholder env)
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env config -q
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env --profile s3 config -q
