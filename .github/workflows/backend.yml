name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "src/**", "deploy/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "src/**", "deploy/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Engine first (backend imports migration_agent.service), then backend with its dev extras.
      - run: pip install -e "..[llm]" -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Typecheck
        run: mypy app
      - name: Tests (SQLite)
        run: python -m pytest -q
      - name: Build check
        run: python -m pip install build && python -m build --wheel --outdir /tmp/backend-dist .

  backend-postgres:
    # Same suite against Postgres to exercise queue locking and row-level security.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password   # throwaway CI database, not a real secret
          POSTGRES_DB: ma_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-only-password@localhost:5432/ma_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[llm]" -e "backend[dev]"
      - run: python -m pytest -q backend
