[project]
name = "migration-agent"
version = "0.2.0"
description = "Read-only legacy service analysis: evidence-backed understanding docs and knowledge graph, with a blind Verifier and human review loop"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["legacy", "migration", "static-analysis", "llm", "documentation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX",
  "Topic :: Software Development :: Documentation",
]
dependencies = [
  "click>=8.1",
  "pydantic>=2.6",
  "jinja2>=3.1",
  "tree-sitter>=0.23",
  "tree-sitter-language-pack>=0.2",
  "pyyaml>=6",
  "tomli>=2; python_version<'3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
llm = ["litellm>=1.40"]

[project.scripts]
migration-agent = "migration_agent.cli:main"

[project.urls]
Documentation = "https://github.com/kavan0910/migration-agent/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/migration_agent"]
# Non-Python package data (analyze/prompts/*.md, verify/prompts/*.md, templates/*.j2,
# sandbox/README.md) is included automatically because it lives inside the package;
# tests/test_release.py asserts this against the built wheel when `build` is available.

[tool.hatch.build.targets.sdist]
include = ["src", "docs", "docker", "scripts/release.py", "README.md", "CHANGELOG.md",
           "pyproject.toml", "*.config.json", ".env.example"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
