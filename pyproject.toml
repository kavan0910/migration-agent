[project]
name = "migration-agent"
version = "0.1.0"
description = "Read-only legacy service analysis: Phase A foundation and static extraction"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1",
  "pydantic>=2.6",
  "jinja2>=3.1",
  "tree-sitter>=0.23",
  "tree-sitter-language-pack>=0.2",
  "pyyaml>=6",
  "tomli>=2; python_version<'3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
migration-agent = "migration_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/migration_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
