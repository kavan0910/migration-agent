# Build context is the repo root:  docker compose -f docker/docker-compose.yml ...
#
# Image: build locally (default) or use a released, signed image:
#   MA_IMAGE=ghcr.io/kavan0910/migration-agent:0.2.0 docker compose -f docker/docker-compose.yml --profile offline run --rm worker-offline analyze /project --offline
# Required: REPO_DIR (source, mounted read-only) and PROJECT_DIR (project folder, read-write).
# Configuration: MA_* variables are passed through by name (docs/deployment.md); secrets likewise.
#
# Profiles:
#   offline (default use) : worker with network_mode none. No egress at all.
#   model                 : worker on an *internal* network (no route to the internet)
#                           + allowlisting proxy that is the only path to the model endpoint.
x-env: &ma-env
  MA_LLM_CONFIG: ${MA_LLM_CONFIG:-}
  MA_LLM_MODEL: ${MA_LLM_MODEL:-}
  MA_LLM_MODEL_CHUNK_EXTRACT: ${MA_LLM_MODEL_CHUNK_EXTRACT:-}
  MA_LLM_MODEL_CROSS_REF: ${MA_LLM_MODEL_CROSS_REF:-}
  MA_LLM_MODEL_BUSINESS_RULES: ${MA_LLM_MODEL_BUSINESS_RULES:-}
  MA_LLM_MODEL_GAP_FILL: ${MA_LLM_MODEL_GAP_FILL:-}
  MA_LLM_MODEL_VERIFIER: ${MA_LLM_MODEL_VERIFIER:-}
  MA_LLM_API_BASE: ${MA_LLM_API_BASE:-}
  MA_LLM_MAX_RETRIES: ${MA_LLM_MAX_RETRIES:-}
  MA_MAX_USD: ${MA_MAX_USD:-}
  MA_LOG_LEVEL: ${MA_LOG_LEVEL:-WARNING}

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  user: "10001:10001"
  pids_limit: 256
  mem_limit: 2g
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
    - /scratch:rw,noexec,nosuid,size=256m,uid=10001,gid=10001

services:
  worker-offline:
    profiles: ["offline"]
    image: ${MA_IMAGE:-migration-agent:local}
    build: { context: .., dockerfile: docker/Dockerfile }
    <<: *hardening
    network_mode: none
    environment:
      <<: *ma-env
    volumes:
      - ${REPO_DIR:?set REPO_DIR}:/workspace:ro     # code mounted read-only
      - ${PROJECT_DIR:?set PROJECT_DIR}:/project    # project folder (only durable state)

  worker:
    profiles: ["model"]
    image: ${MA_IMAGE:-migration-agent:local}
    build: { context: .., dockerfile: docker/Dockerfile }
    <<: *hardening
    networks: [sandbox_internal]       # internal: true => no default route out
    environment:
      <<: *ma-env
      HTTPS_PROXY: http://egress-proxy:3128
      HTTP_PROXY: http://egress-proxy:3128
      NO_PROXY: ""
      # Injected at runtime, never baked. Empty values are ignored by the CLI.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ${REPO_DIR:?set REPO_DIR}:/workspace:ro
      - ${PROJECT_DIR:?set PROJECT_DIR}:/project
    depends_on: [egress-proxy]

  # Allowlisting forward proxy: CONNECT only to MODEL_ENDPOINT_HOST:443, everything else denied.
  egress-proxy:
    profiles: ["model"]
    image: ubuntu/squid:6.6-24.04_beta
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]          # squid drops privileges at start
    security_opt: ["no-new-privileges:false"]
    tmpfs: [/var/run, /var/log/squid, /var/spool/squid]
    environment:
      MODEL_ENDPOINT_HOST: ${MODEL_ENDPOINT_HOST:-api.anthropic.com}   # hostname only, no scheme/port
    volumes:
      - ./squid.conf:/etc/squid/squid.conf.tpl:ro
    # Render the allowlist from the template, then run squid in the foreground.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mkdir -p /var/run/squid &&
        sed "s/__MODEL_ENDPOINT_HOST__/$${MODEL_ENDPOINT_HOST}/" /etc/squid/squid.conf.tpl > /var/run/squid.conf &&
        exec squid -f /var/run/squid.conf -N -C
    networks: [sandbox_internal, egress]   # the only service attached to a routable network

networks:
  sandbox_internal:
    internal: true
  egress: {}
