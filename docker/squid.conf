# Allowlist proxy: only HTTPS CONNECT to the model endpoint.
# __MODEL_ENDPOINT_HOST__ is replaced at container start from $MODEL_ENDPOINT_HOST
# (see docker-compose.yml; default api.anthropic.com). Use the exact host of MA_LLM_API_BASE
# when a gateway is configured, e.g. llm-gateway.corp.example.
http_port 3128
acl model_host dstdomain __MODEL_ENDPOINT_HOST__
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access allow CONNECT model_host SSL_ports
http_access deny all
cache deny all
access_log stdio:/var/log/squid/access.log
pid_filename /var/run/squid/squid.pid
