# Allowlist proxy: only HTTPS CONNECT to the model endpoint. Set the host below
# (default api.anthropic.com) to match MODEL_ENDPOINT_HOST in docker-compose.yml.
http_port 3128
acl model_host dstdomain api.anthropic.com
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access allow CONNECT model_host SSL_ports
http_access deny all
cache deny all
access_log stdio:/var/log/squid/access.log
