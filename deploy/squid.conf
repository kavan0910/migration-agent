# Allowlist proxy for the platform stack (worker egress). CONNECT :443 to
#   - the model endpoint host (MODEL_ENDPOINT_HOST), and
#   - the git hosts in GIT_ALLOWED_HOSTS (the worker clones public repositories through this proxy).
# Everything else is denied. With GIT_ALLOWED_HOSTS empty, git clones from the worker fail closed.
# __MODEL_ENDPOINT_HOST__ is substituted and /var/run/squid/git_hosts.txt is generated by the compose entrypoint.
http_port 3128
acl model_host dstdomain __MODEL_ENDPOINT_HOST__
acl git_hosts dstdomain "/var/run/squid/git_hosts.txt"
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access allow CONNECT model_host SSL_ports
http_access allow CONNECT git_hosts SSL_ports
http_access deny all
cache deny all
access_log stdio:/var/log/squid/access.log
pid_filename /var/run/squid/squid.pid
